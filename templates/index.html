<!DOCTYPE html>
<html>
<head>
    <title>Fake News & Deepfake Detection System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        h1 {
            color: #333;
        }

        h2, h3 {
            color: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Fake News & Deepfake Detection System</h1>

    <!-- Fake News Detection -->
    <div class="box">

        <h2>Fake News Detection</h2>

        <form action="/predict_news" method="POST">

            <textarea
                name="news"
                placeholder="Enter news text here..."
                required></textarea>

            <br><br>

            <button type="submit">
                Check News
            </button>

        </form>

        {% if ml_result %}
        <hr>

        <h3>ML Prediction: {{ ml_result }}</h3>

        <h3>Online Verification: {{ online_result }}</h3>

        <h2>Final Result: {{ final_result }}</h2>

        {% endif %}

    </div>

    <!-- Deepfake Detection -->
    <div class="box">

        <h2>Deepfake Detection</h2>

        <form
            action="/predict_image"
            method="POST"
            enctype="multipart/form-data">

            <input
                type="file"
                name="image"
                accept="image/*"
                required>

            <br><br>

            <button type="submit">
                Check Image
            </button>

        </form>

        {% if image_result %}
        <hr>

        <h2>{{ image_result }}</h2>

        {% endif %}

    </div>

</div>

</body>
</html>
